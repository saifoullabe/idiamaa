<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="IDIAMA Agro — gestion des fermes avicoles : production, recettes, dépenses, stocks et présences.">
  <meta name="theme-color" content="#1B5E20">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="IDIAMA Agro">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>IDIAMA Agro</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0F1610; }

    /* Le temps que l'application se charge, on montre autre chose
       qu'une page blanche — la connexion peut être lente. */
    #chargement {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: linear-gradient(135deg, #071A07, #1B5E20 55%, #14401A);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      z-index: 9999;
      transition: opacity .35s ease;
    }
    #chargement.parti { opacity: 0; pointer-events: none; }
    #chargement .oeuf {
      width: 78px; height: 78px;
      border-radius: 26px;
      background: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 40px;
      box-shadow: 0 18px 40px rgba(0,0,0,.35);
    }
    #chargement .nom {
      font-size: 22px; font-weight: 800; letter-spacing: -.5px;
    }
    #chargement .sous {
      font-size: 12.5px; color: rgba(255,255,255,.7); margin-top: -12px;
    }
    #chargement .barre {
      width: 168px; height: 4px; border-radius: 4px;
      background: rgba(255,255,255,.18);
      overflow: hidden;
    }
    #chargement .barre span {
      display: block; width: 40%; height: 100%; border-radius: 4px;
      background: #F9A825;
      animation: glisse 1.15s ease-in-out infinite;
    }
    @keyframes glisse {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(320%); }
    }
  </style>
</head>
<body>
  <div id="chargement">
    <div class="oeuf">🐔</div>
    <div class="nom">IDIAMA Agro</div>
    <div class="sous">Chargement de votre espace…</div>
    <div class="barre"><span></span></div>
  </div>

  <script>
    // Flutter prévient quand il a dessiné son premier écran :
    // c'est à ce moment-là qu'on retire l'écran d'attente.
    window.addEventListener('flutter-first-frame', function () {
      var ecran = document.getElementById('chargement');
      if (!ecran) return;
      ecran.classList.add('parti');
      setTimeout(function () { ecran.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
